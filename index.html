    const logEl = document.getElementById('log');
    const btnPolicies = document.getElementById('btn-policies');
    const btnSecurityPlan = document.getElementById('btn-security-plan');

    function log(msg) {
        logEl.textContent += msg + '\n';
        logEl.scrollTop = logEl.scrollHeight;
    }

    function clearLog() {
        logEl.textContent = '';
    }

    function getConfig() {
        return {
            baseUrl: 'https://bediso-dev.cisomate.com/api',
            token: document.getElementById('token').value.trim(),
        };
    }

    function setBusy(busy) {
        btnPolicies.disabled = busy;
        btnSecurityPlan.disabled = busy;
    }

    async function api(baseUrl, token, path, options = {}) {
        const res = await fetch(baseUrl + path, {
            credentials: 'include',
            headers: {
                'Content-Type': 'application/json',
                Authorization: 'Bearer ' + token,
                ...(options.headers || {}),
            },
            ...options,
        });

        if (!res.ok) {
            const text = await res.text();
            throw new Error((options.method || 'GET') + ' ' + path + ' -> ' + res.status + ': ' + text);
        }

        if (res.status === 204) return null;

        const ct = res.headers.get('content-type') || '';
        if (ct.includes('application/json')) return res.json();

        const text = await res.text();
        try { return JSON.parse(text); } catch { return text; }
    }

    // create-policies-test.component.ts
    async function createPoliciesTestData(baseUrl, token) {
        log('Fetching policies...');
        const { policies } = await api(baseUrl, token, '/CMDISOPolicy/GetPolicyCoverage');

        if (!policies?.length) {
            log('No policies found.');
            return;
        }

        log('Found ' + policies.length + ' policies.');

        for (const policy of policies) {
            log('Policy: ' + (policy.policyName || policy.id));
            const controls = await api(
                baseUrl, token,
                '/CMDISOControlForPolicy/ControlsForPolicy?policyId=' + encodeURIComponent(policy.id),
            );
            log('  ' + controls.length + ' controls');

            for (const control of controls) {
                await api(baseUrl, token, '/CMDISOControlForPolicy/UpdateControlStatus', {
                    method: 'PUT',
                    body: JSON.stringify({ policyId: policy.id, controlId: control.id, state: 'Approved' }),
                });
                log('  control approved: ' + control.id);
            }
        }

        for (const policy of policies) {
            await api(baseUrl, token, '/CMDISOPolicy/' + policy.id + ':approve', {
                method: 'POST',
                body: '{}',
            });
            log('Policy approved: ' + (policy.policyName || policy.id));
        }

        log('Done.');
    }

    // create-testing-data.component.ts → createEverythingBlyat()
    async function createSecurityPlanTestData(baseUrl, token) {
        log('Creating security plan...');
        const planId = await api(baseUrl, token, '/CMDISOSecurityPlan/CreateUpdatePlan', {
            method: 'POST',
            body: JSON.stringify(mockPlan),
        });
        log('Plan created: ' + planId);

        for (let i = 0; i < mockRisks.length; i++) {
            const risk = mockRisks[i];
            log('Saving risk ' + (i + 1) + '/' + mockRisks.length + '...');

            const saveManual = await api(baseUrl, token, '/CMDISORiskInOrg/SaveManual', {
                method: 'POST',
                body: JSON.stringify({ ...risk, planId }),
            });

            const dto = {
                ...selectQuarterMock,
                newTargetDate: targetDateMock[Math.floor(Math.random() * targetDateMock.length)],
                planId,
                riskInPlanId: saveManual.riskInOrgId,
                selectedRimsId: saveManual.rimsId,
            };

            await api(baseUrl, token, '/CMDISORiskInOrg/SavePlanSimulationChange', {
                method: 'POST',
                body: JSON.stringify(dto),
            });

            log('  risk saved: ' + saveManual.riskInOrgId);
        }

        await api(baseUrl, token, '/CMDISOSecurityPlan/UpdatePlanStatus', {
            method: 'PUT',
            body: JSON.stringify({ planId, newStatusId: 2 }),
        });

        log('Plan status updated. Done.');
    }

    async function run(fn) {
        clearLog();
        const { baseUrl, token } = getConfig();
        if (!token) { log('Error: paste a bearer token first.'); return; }
        setBusy(true);
        try { await fn(baseUrl, token); }
        catch (err) { log('Error: ' + err.message); console.error(err); }
        finally { setBusy(false); }
    }

    btnPolicies.addEventListener('click', () => run(createPoliciesTestData));
    btnSecurityPlan.addEventListener('click', () => run(createSecurityPlanTestData));
